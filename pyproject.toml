[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ATOMIQA"
version = "3.0"
description = "A PyQt6 application for data acquisition and analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "PyQt6",
    "PyQt6-Charts",
    "pyqtgraph",
    "pyserial",
    "arch",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
